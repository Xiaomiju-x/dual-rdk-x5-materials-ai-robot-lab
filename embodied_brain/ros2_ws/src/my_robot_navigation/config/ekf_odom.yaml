ekf_filter_node:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.25
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.1
    print_diagnostics: true
    debug: false
    publish_tf: true
    publish_acceleration: false
    reset_on_time_jump: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # F407 wheel odometry is open-loop step integration. Fuse velocities only;
    # integrating its pose again would over-trust wheel slip and missed steps.
    odom0: /wheel_odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 20
    odom0_nodelay: true

    # /imu is emitted only after the F407 bridge validates raw telemetry.
    # Orientation remains intentionally unused until mounting calibration.
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
    imu0_queue_size: 50
    imu0_nodelay: true

    use_control: false
    dynamic_process_noise_covariance: true
