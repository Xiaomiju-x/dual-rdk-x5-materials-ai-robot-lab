repos:
  - repo: local
    hooks:
      - id: publication-audit
        name: Public release audit
        entry: python tools/publication/audit_release.py --root . --strict
        language: system
        pass_filenames: false
      - id: offline-tests
        name: Hardware-free unit tests
        entry: python -m unittest discover -s tests_public -v
        language: system
        pass_filenames: false
