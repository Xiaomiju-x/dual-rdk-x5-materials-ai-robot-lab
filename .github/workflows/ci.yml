name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-and-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Verify generated award blocks
        run: python -B tools/publication/render_award_status.py --check
      - name: Verify deterministic SPDX SBOM
        run: python -B tools/publication/generate_sbom.py --check
      - name: Check repository-local Markdown links
        run: python -B tools/publication/check_markdown_links.py . --format text
      - name: Audit the public release boundary
        run: python -B tools/publication/audit_release.py . --strict --format text
      - name: Verify public-media hashes, metadata, audio and size
        run: python -B tools/publication/verify_media.py --root .
      - name: Run hardware-free tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s tests_public -p "test_*.py" -v
      - name: Exercise the deterministic offline demo
        run: python -B examples/offline_demo/run_demo.py > offline-receipt.json
      - name: Upload offline receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-inspection-receipt
          path: offline-receipt.json
          if-no-files-found: error

  workstation-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workstation_frontend_public
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: workstation_frontend_public/package-lock.json
      - run: npm ci
      - name: Reject vulnerable npm dependencies
        run: npm audit --audit-level=low
      - run: npm run build

  embodied-dashboard-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: embodied_brain/ros2_ws/src/my_robot_dashboard/frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
      - name: Activate the lockfile-declared pnpm version
        run: corepack enable && corepack prepare pnpm@9.12.3 --activate
      - run: pnpm install --frozen-lockfile
      - name: Reject vulnerable pnpm dependencies
        run: pnpm audit --audit-level=low
      - name: Lint the embodied dashboard frontend
        run: pnpm run lint
      - run: pnpm run build
