name: Feature request
description: Propose a scoped, testable improvement.
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which user or reproducibility problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Include boundaries, expected evidence, and how it can be tested without physical motion.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This proposal does not require sharing private credentials or datasets without redistribution rights.
          required: true
